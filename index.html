<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Dashboard</title>
    <style>
        :root { --primary: #4a90e2; --accent: #2ecc71; --danger: #e74c3c; --neutral: #95a5a6; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .label { font-weight: bold; color: #555; display: block; margin-top: 15px; font-size: 0.85em; text-transform: uppercase; }
        .original-label { color: #e67e22; font-weight: bold; margin-bottom: 10px; display: block; }
        .text { margin: 5px 0 15px; font-size: 1.1em; }
        .btn-group { display: flex; gap: 8px; margin-top: 5px; flex-wrap: wrap; }
        button { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; color: white; font-weight: bold; transition: 0.2s; }
        button:hover { opacity: 0.8; }
        .q-correct { background-color: var(--accent); }
        .q-incorrect { background-color: var(--danger); }
        .s-pos { background-color: var(--accent); }
        .s-neu { background-color: var(--neutral); }
        .s-neg { background-color: var(--danger); }
        .pagination { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Verification Dashboard</h1>
    <select id="category-select" onchange="resetAndLoad()" style="padding:10px; width:100%; margin-bottom:20px; cursor:pointer;">
        <option value="Lexical">Lexical</option>
        <option value="Morphological">Morphological</option>
        <option value="Phonological">Phonological</option>
        <option value="Sequence">Sequence</option>
        <option value="Syntactic">Syntactic</option>
    </select>

    <div id="sentence-container">Loading data...</div>

    <div class="pagination">
        <button id="prev-btn" onclick="changePage(-1)">Previous</button>
        <span id="page-info">Page 1</span>
        <button id="next-btn" onclick="changePage(1)">Next</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getFirestore, collection, getDocs, updateDoc, doc, arrayUnion } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA9ZYnibLcHUq6F-cuLnoxMG0h-TonJBQk",
        authDomain: "sentencevote.firebaseapp.com",
        projectId: "sentencevote",
        storageBucket: "sentencevote.firebasestorage.app",
        messagingSenderId: "23707308265",
        appId: "1:23707308265:web:6b2aa058bd88df9e6d6078",
        measurementId: "G-HX7HELMVN7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allDocs = [];
    let currentPage = 0;
    const itemsPerPage = 10;

    window.onload = () => {
        if (!sessionStorage.getItem("voterName")) {
            sessionStorage.setItem("voterName", prompt("Please enter your name:") || "Anonymous");
        }
    };

    window.resetAndLoad = async () => {
        currentPage = 0;
        const category = document.getElementById('category-select').value;
        const container = document.getElementById('sentence-container');
        container.innerHTML = "Loading...";
        try {
            const snapshot = await getDocs(collection(db, category));
            allDocs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a,b) => a.id - b.id);
            renderPage();
        } catch (e) { container.innerHTML = "Error loading data."; console.error(e); }
    };

    function renderPage() {
        const container = document.getElementById('sentence-container');
        container.innerHTML = "";
        const pageItems = allDocs.slice(currentPage*itemsPerPage, (currentPage+1)*itemsPerPage);
        
        if (pageItems.length === 0) container.innerHTML = "No sentences found in this category.";

        pageItems.forEach(data => {
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `
                <span class="label">Original Sentence:</span> <div class="text">${data.clean_sentence}</div>
                <span class="label">Transformed:</span> <div class="text">${data.transformed_sentence}</div>
                <span class="original-label">Label: ${data.label}</span>
                
                <span class="label">Transformation Correct?</span>
                <div class="btn-group">
                    <button class="q-correct" onclick="submitVote('${data.id}', 'Correct', null)">Correct</button>
                    <button class="q-incorrect" onclick="submitVote('${data.id}', 'Incorrect', null)">Incorrect</button>
                </div>
                
                <span class="label">Sentiment:</span>
                <div class="btn-group">
                    <button class="s-pos" onclick="submitVote('${data.id}', null, 1)">Positive (1)</button>
                    <button class="s-neu" onclick="submitVote('${data.id}', null, 0)">Neutral (0)</button>
                    <button class="s-neg" onclick="submitVote('${data.id}', null, 2)">Negative (2)</button>
                </div>
            `;
            container.appendChild(div);
        });
        document.getElementById('page-info').innerText = `Page ${currentPage + 1}`;
        document.getElementById('prev-btn').disabled = currentPage === 0;
        document.getElementById('next-btn').disabled = (currentPage + 1) * itemsPerPage >= allDocs.length;
    }

    window.submitVote = async (docId, quality, sentiment) => {
        const category = document.getElementById('category-select').value;
        try {
            await updateDoc(doc(db, category, docId), {
                votes: arrayUnion({ 
                    user: sessionStorage.getItem("voterName"), 
                    quality: quality, 
                    sentiment: sentiment,
                    time: new Date().toISOString() 
                })
            });
            alert("Vote recorded successfully!");
        } catch (e) { 
            console.error(e);
            alert("Error recording vote. Check console for details."); 
        }
    };

    window.changePage = (dir) => { currentPage += dir; renderPage(); window.scrollTo(0,0); };
    resetAndLoad();
</script>
</body>
</html>
